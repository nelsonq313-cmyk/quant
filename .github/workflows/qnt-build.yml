name: QNT Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock=false
      - name: Build and capture log
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "$code" > build.exit
          exit 0
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: qnt-build-log
          path: |
            build.log
            build.exit
          if-no-files-found: error
      - name: Enforce build result
        shell: bash
        run: test "$(cat build.exit)" = "0"
